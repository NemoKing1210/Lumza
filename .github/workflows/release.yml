name: Release

# Pushing a tag such as v1.0.0 builds the NSIS installers (x64 and ARM64) and a portable
# archive, signs the update packages and publishes everything, plus latest.json for the
# in-app updater, as a draft GitHub Release. The release notes are the matching section of
# CHANGELOG.md, and the build refuses to start if the tag and the version files disagree.
#
# Run it by hand from the Actions tab for a dry run: the same build, but nothing is
# published; the installers come back as workflow artifacts instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Check version and notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version files
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ui=$(node -p "require('./ui/package.json').version")
          root=$(node -p "require('./package.json').version")
          bad=0
          for pair in "Cargo.toml=$cargo" "src-tauri/tauri.conf.json=$tauri" "ui/package.json=$ui" "package.json=$root"; do
            if [ "${pair#*=}" != "$want" ]; then
              echo "::error::${pair%%=*} has version ${pair#*=}, but the tag is $TAG"
              bad=1
            fi
          done
          exit $bad

      - name: Release notes from CHANGELOG.md
        id: notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          # The body of the "## [x.y.z]" section, without its heading line.
          awk -v v="$want" '
            { sub(/\r$/, "") }
            /^## \[/ { if (on) exit; on = (index($0, "[" v "]") == 4); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $want; run git cliff first (see CONTRIBUTING.md)"
            exit 1
          fi
          { echo 'body<<LUMZA_NOTES_EOF'; cat notes.md; echo 'LUMZA_NOTES_EOF'; } >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            args: ""
            out: target/release
          - target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc"
            out: target/aarch64-pc-windows-msvc/release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm --prefix ui ci

      - name: Build, sign and publish the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private key made with `tauri signer generate`; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Without a tag (a manual run) the action only builds and publishes nothing.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Lumza ${{ github.ref_name }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build the command-line tool for the portable archive
        run: cargo build --release -p lumza-cli ${{ matrix.args }}

      - name: Portable archive
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.target }}' -like 'aarch64*') { 'arm64' } else { 'x64' }
          $dir = "Lumza-portable-$arch"
          New-Item $dir -ItemType Directory | Out-Null
          Copy-Item "${{ matrix.out }}/lumza.exe", "${{ matrix.out }}/lumzactl.exe" $dir
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md, README.ru.md $dir
          # LUMZA_DATA_DIR keeps settings next to the exe; the launcher sets it.
          Set-Content "$dir/Lumza.cmd" '@echo off' , 'set LUMZA_DATA_DIR=%~dp0data' , 'set LUMZA_NO_AUTOSTART=1' , 'start "" "%~dp0lumza.exe"'
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          if ('${{ github.ref_type }}' -eq 'tag') {
            gh release upload "${{ github.ref_name }}" "$dir.zip" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A manual run publishes nothing; keep the results where they can be downloaded and tried.
      - name: Keep the dry-run results as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: lumza-${{ matrix.target }}
          path: |
            ${{ matrix.out }}/bundle/nsis/*-setup.exe*
            Lumza-portable-*.zip
          if-no-files-found: error
          retention-days: 7

# Later, once releases are stable: add a winget-releaser step (vedantmgoyal9/winget-releaser)
# and a Scoop manifest. Code signing (SignPath Foundation) needs an application first.
