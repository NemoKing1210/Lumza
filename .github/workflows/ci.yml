name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check (svelte-check covers .ts and .svelte)
        run: npm run typecheck
      - name: Vitest (includes the RU/EN locale completeness test)
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust (fmt, clippy, tests, build)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the frontend (embedded into the app at compile time)
        run: npm --prefix ui ci && npm --prefix ui run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Compile the x64 app (no installer)
        run: cargo build --release -p lumza
