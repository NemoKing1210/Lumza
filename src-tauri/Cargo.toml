[package]
name = "lumza"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight tray app to control monitor brightness, contrast and volume over DDC/CI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumza-core = { path = "../crates/lumza-core" }
tauri = { version = "2", default-features = false, features = ["tray-icon", "image-png", "wry", "compression"] }
window-vibrancy = "0.6"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
winreg = "0.56"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_Globalization",
]
